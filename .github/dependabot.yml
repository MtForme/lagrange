version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # Library lower bounds only — group the noise into one PR.
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # mcp 2.x renamed FastMCP -> MCPServer and moved mcp.server.fastmcp;
      # lagrange/mcp_server.py targets the v1 API. Revisit when migrating.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
